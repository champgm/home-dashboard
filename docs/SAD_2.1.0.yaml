adversarial_review_checklist:
  bridge_scope: 'pass: permanent single bridge; replacement/switching explicitly non-goal.'
  same_id_favorites: accepted risk DG-002; not a blocker.
  recovery_complexity: 'pass: no durable delete/search/provisioning journals; ordinary refresh/manual retry selected.'
  persistence: 'pass: one JSON config object + SecureStore, explicit corruption/reset semantics.'
  concurrency: 'pass: one Hue mutation, generation invalidation, no distributed locking.'
  networking: 'pass: private IPv4 validation with normal OS route selection under explicit accepted DG-004.'
  action_policy: 'pass: immediate-operation policy only; transitive safety explicitly non-required DG-005.'
  full_management: 'pass: remains binding and backed by HueV1ResourceCatalog + documented V1 forms/fixtures.'
  deletion_confirmation: pass.
  privacy: 'pass: no cloud/analytics/sync; backup disabled.'
  testability: 'pass: all mandatory requirements mapped to objective ACs.'
