    src/storage: ConfigStore + CredentialStore
    src/config: bundled defaults/overlay resolution/private IPv4 validation
    android: only build/network-security configuration and optional TCP fallback module
  legacy_migration_policy: Port reusable protocol/model behavior deliberately; do not retain duplicate old/new application
    trees.
