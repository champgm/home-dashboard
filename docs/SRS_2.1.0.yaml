risks:
- id: RISK-001
  status: accepted/mitigated
  description: Frozen undocumented Hue V1 and TP-Link behavior may differ from references.
  mitigation: Keep adapters isolated and regression-test against sanitized live fixtures.
- id: RISK-002
  status: accepted
  description: A successful Hue create-user followed by process/storage failure may leave an unused API user on the bridge.
  rationale: Rare setup/reauthorization event; durable provisioning transactions are intentionally omitted under DG-003.
- id: RISK-003
  status: accepted
  description: An externally deleted Hue resource may later be recreated with the same kind/id and an old Favorite can resolve
    to the replacement.
  rationale: Explicit stakeholder acceptance under DG-002; household resources are exceptionally static.
- id: RISK-004
  status: accepted
  description: After ambiguous delete/create or process loss, the app may require manual refresh/retry and may leave a stale
    Favorite until ordinary refresh/user cleanup.
  rationale: Consequence is low and deliberate under DG-003.
- id: RISK-005
  status: accepted
  description: The application does not force private-IP traffic onto a particular Android Network, bypass user-configured
    VPN/proxy routing, or defend against a malicious local bridge redirecting transport at the platform layer.
  rationale: Explicit simplification under DG-004; the household bridge/plugs and phone networking environment are trusted,
    endpoints remain private/static, and the app has no cloud control dependency.
- id: RISK-006
  status: accepted/operational
  description: Hue Schedules can embed an API username in command addresses. Reauthorization does not automatically rewrite
    existing Schedule commands; a Schedule using an invalid old user may require the explicit Rebuild command authorization
    editor action.
  rationale: Automatic rewriting could take ownership of schedules created by other API users; explicit repair is simpler
    and safer.
- id: RISK-007
  status: accepted
  description: A permitted Rule/Schedule can affect another pre-existing automation whose later/transitive behavior would
    have been prohibited if authored directly by Home Dashboard.
  rationale: DG-005 intentionally limits policy checks to the immediate operation in this trusted, static household; direct
    dangerous actions remain blocked.
- id: RISK-008
  status: accepted/operational
  description: Loss of the private APK signing key prevents in-place signed updates.
  mitigation: Maintain signing key custody outside the runtime/source repository.
