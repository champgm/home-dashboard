configuration_defaults_overlay_contract:
  effective_model: "currently installed APK bundled defaults plus one phone-local non-secret user overlay"
  supported_default_fields:
  - bridge.ipv4
  - plugs[].id
  - plugs[].ipv4
  - plugs[].port
  overlay_intents:
  - never_overridden
  - explicit_bridge_override
  - explicit_plug_override
  - explicitly_removed_bundled_plug
  - user_added_plug
  removal_rule: "An explicitly removed bundled plug remains absent across later APK updates."
  precedence: "explicit removal > explicit override > bundled default > absent"
  reset: "discard the non-secret overlay and resolve against the currently installed APK defaults"
  migration: "2.0 materialized configuration is converted to provenance-aware overlay state without changing effective state for defaults already present"
  corruption_and_io: "corrupt/unreadable state and persistence I/O failures are fail-closed; neither is an empty overlay"
  secrets: "HueBinding {bridgeId, credential} remains protected and outside the overlay"
  identities: "bundled plug IDs are immutable physical identities and are never reused"
  synchronization: "none; each phone resolves its own overlay independently"
